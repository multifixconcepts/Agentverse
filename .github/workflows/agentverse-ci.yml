name: AgentVerse CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-syntax:
    name: lint-and-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: PHP Lint
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' \
            -not -path './scholapro/classes/MoTranslator/*' \
            -print0 | xargs -0 -n1 php -l 2>&1 | tee /tmp/php-lint.txt
          if grep -q "Parse error\|Fatal error" /tmp/php-lint.txt; then
            echo "::error::PHP syntax errors found"
            exit 1
          fi

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: /tmp/php-lint.txt

  regression-tests:
    name: regression-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Control Plane Regression Tests
        run: |
          chmod +x _tests/control-plane-regression.sh
          bash _tests/control-plane-regression.sh 2>&1 | tee /tmp/regression-results.txt
          exit ${PIPESTATUS[0]}

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: /tmp/regression-results.txt

  adversarial-tests:
    name: adversarial-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run Adversarial Tests
        run: |
          chmod +x _tests/scenario8-adversarial.sh
          bash _tests/scenario8-adversarial.sh 2>&1 | tee /tmp/adversarial-results.txt
          exit ${PIPESTATUS[0]}

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-results
          path: /tmp/adversarial-results.txt

  remediation-tests:
    name: remediation-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run Remediation Tests
        run: |
          chmod +x _tests/remediation-tests.sh
          bash _tests/remediation-tests.sh 2>&1 | tee /tmp/remediation-results.txt
          exit ${PIPESTATUS[0]}

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-results
          path: /tmp/remediation-results.txt

  verify-release-set:
    name: verify-release-set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Release Set
        run: |
          chmod +x _tools/verify-release-set.sh
          RESULT=$(_tools/verify-release-set.sh --all-released 2>&1)
          echo "$RESULT" | tee /tmp/release-set-results.txt
          VERDICT=$(echo "$RESULT" | python3 -c "import sys, json; print(json.load(sys.stdin).get('verdict', 'DENY'))" 2>/dev/null || echo "DENY")
          if [ "$VERDICT" != "ALLOW" ]; then
            echo "::error::Release set verification failed"
            exit 1
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-set-results
          path: /tmp/release-set-results.txt

  doctor-check:
    name: doctor-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run Doctor
        run: |
          chmod +x _tools/doctor.sh
          _tools/doctor.sh --ci 2>&1 | tee /tmp/doctor-output.txt
          if grep -q "BLOCKED" /tmp/doctor-output.txt; then
            echo "::error::Doctor check returned BLOCKED"
            exit 1
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-results
          path: /tmp/doctor-output.txt

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Changed Files
        run: |
          if [ -f _tools/scan-secrets.sh ]; then
            chmod +x _tools/scan-secrets.sh
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.php' '*.json' '*.yml' '*.yaml' '*.md' '*.env*' '*.sh' '*.xml')
            else
              CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.php' '*.json' '*.yml' '*.yaml' '*.md' '*.env*' '*.sh' '*.xml' 2>/dev/null || git ls-files)
            fi
            echo "$CHANGED" | xargs -r _tools/scan-secrets.sh 2>&1 | tee /tmp/secret-scan.txt
            if grep -q "HIGH" /tmp/secret-scan.txt; then
              echo "::error::HIGH severity secrets detected"
              exit 1
            fi
          else
            echo "scan-secrets.sh not found"
            exit 1
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: /tmp/secret-scan.txt

  state-consistency:
    name: state-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify State Consistency
        run: |
          if [ -f AGENTVERSE/CURRENT_STATE.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('AGENTVERSE/CURRENT_STATE.json','utf8'))"
            if [ $? -ne 0 ]; then
              echo "::error::CURRENT_STATE.json is not valid JSON"
              exit 1
            fi
            echo "CURRENT_STATE.json is valid"
          else
            echo "::error::CURRENT_STATE.json not found"
            exit 1
          fi

          if [ -f AGENTVERSE/ORG_CHECKSUM.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('AGENTVERSE/ORG_CHECKSUM.json','utf8'))"
            if [ $? -ne 0 ]; then
              echo "::error::ORG_CHECKSUM.json is not valid JSON"
              exit 1
            fi
            echo "ORG_CHECKSUM.json is valid"
          fi

      - name: Verify ORG_CHECKSUM Integrity
        run: |
          if [ -f _tools/verify-state-consistency.sh ]; then
            chmod +x _tools/verify-state-consistency.sh
            _tools/verify-state-consistency.sh 2>&1 | tee /tmp/consistency-results.txt
          else
            echo "verify-state-consistency.sh not found, skipping"
            echo "SKIPPED" > /tmp/consistency-results.txt
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-results
          path: /tmp/consistency-results.txt

  polyglot-validation:
    name: polyglot-validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, typescript, python, go, rust, java, dotnet, c-cpp, ruby, php]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.runtime == 'node' || matrix.runtime == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        if: matrix.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        if: matrix.runtime == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Rust
        if: matrix.runtime == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup .NET
        if: matrix.runtime == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup C/C++
        if: matrix.runtime == 'c-cpp'
        run: sudo apt-get update && sudo apt-get install -y gcc g++

      - name: Setup Ruby
        if: matrix.runtime == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup PHP
        if: matrix.runtime == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Validate (${{ matrix.runtime }})
        run: |
          case "${{ matrix.runtime }}" in
            node)
              node --version
              echo 'console.log("Node OK")' > /tmp/test.js && node /tmp/test.js
              ;;
            typescript)
              npm install -g typescript
              tsc --version
              echo 'const msg: string = "TS OK"; console.log(msg);' > /tmp/test.ts
              tsc --outDir /tmp /tmp/test.ts && node /tmp/test.js
              ;;
            python)
              python3 --version
              python3 -c "import sqlite3, json, hashlib; print('stdlib OK')"
              python3 -c "print('Python OK')"
              ;;
            go)
              go version
              echo 'package main; import "fmt"; func main() { fmt.Println("Go OK") }' > /tmp/test.go
              go run /tmp/test.go
              ;;
            rust)
              rustc --version && cargo --version
              echo 'fn main() { println!("Rust OK"); }' > /tmp/test.rs
              rustc /tmp/test.rs -o /tmp/test && /tmp/test
              ;;
            java)
              java --version && javac --version
              echo 'public class Test { public static void main(String[] a) { System.out.println("Java OK"); } }' > /tmp/Test.java
              javac /tmp/Test.java -d /tmp && java -cp /tmp Test
              ;;
            dotnet)
              dotnet --version
              dotnet new console -o /tmp/dotnet-test --force
              cd /tmp/dotnet-test && dotnet run
              ;;
            c-cpp)
              gcc --version && g++ --version
              echo '#include<stdio.h>' > /tmp/test.c && echo 'int main(){printf("C OK\n");return 0;}' >> /tmp/test.c
              gcc /tmp/test.c -o /tmp/test_c && /tmp/test_c
              echo '#include<iostream>' > /tmp/test.cpp && echo 'int main(){std::cout<<"C++ OK"<<std::endl;return 0;}' >> /tmp/test.cpp
              g++ /tmp/test.cpp -o /tmp/test_cpp && /tmp/test_cpp
              ;;
            ruby)
              ruby --version
              ruby -e 'puts "Ruby OK"'
              ;;
            php)
              php --version
              php -r 'echo "PHP OK\n";'
              ;;
            *)
              echo "Unknown runtime: ${{ matrix.runtime }}"
              exit 1
              ;;
          esac

  polyglot-toolchain-verify:
    name: polyglot-toolchain-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup C/C++
        run: sudo apt-get update && sudo apt-get install -y gcc g++ make cmake

      - name: Run Polyglot Validation Script
        run: |
          chmod +x _tools/validate-polyglot.sh
          bash _tools/validate-polyglot.sh all 2>&1 | tee /tmp/polyglot-results.txt
          exit ${PIPESTATUS[0]}

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-toolchain-results
          path: /tmp/polyglot-results.txt

  smoke-project-suite:
    name: smoke-project-suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [javascript, typescript, python, go, rust, java, csharp, c, cpp, ruby, kotlin, php, swift, dart]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        if: contains(matrix.runtime, 'javascript') || contains(matrix.runtime, 'typescript')
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        if: matrix.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        if: matrix.runtime == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Rust
        if: matrix.runtime == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup .NET
        if: matrix.runtime == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup C/C++
        if: contains(matrix.runtime, 'c') || contains(matrix.runtime, 'cpp')
        run: sudo apt-get update && sudo apt-get install -y gcc g++

      - name: Setup Ruby
        if: matrix.runtime == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup PHP
        if: matrix.runtime == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run Smoke Test (${{ matrix.runtime }})
        run: |
          chmod +x _tests/polyglot-smoke-suite.sh
          bash _tests/polyglot-smoke-suite.sh ${{ matrix.runtime }}

  framework-smoke-suite:
    name: framework-smoke-suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [express, fastapi, aspnet, spring, laravel, react, django]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        if: contains(matrix.framework, 'express') || contains(matrix.framework, 'react')
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        if: contains(matrix.framework, 'fastapi') || contains(matrix.framework, 'django')
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET
        if: matrix.framework == 'aspnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java
        if: matrix.framework == 'spring'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup PHP
        if: matrix.runtime == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Kotlin
        if: matrix.runtime == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Kotlin
        if: matrix.runtime == 'kotlin'
        run: |
          curl -sSL https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> $GITHUB_PATH

      - name: Setup Swift
        if: matrix.runtime == 'swift'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.9'

      - name: Setup Dart
        if: matrix.runtime == 'dart'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          tools: composer:v2

      - name: Run Framework Smoke (${{ matrix.framework }})
        run: |
          chmod +x _tests/framework-smoke-suite.sh
          bash _tests/framework-smoke-suite.sh ${{ matrix.framework }}
